<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AIチーム デモ</title>
<style>
:root{
  --bg:#f6f5f2; --panel:#fff; --line:#e7e5df; --line2:#d9d6ce;
  --text:#1f1f1d; --muted:#6c6b66; --faint:#a3a19a;
  --accent:#4f46e5; --accent-bg:#eef0ff;
  --ok:#15803d; --ok-bg:#e7f6ec;
  --todo:#b45309; --todo-bg:#fdf1de;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
kbd{font-family:inherit;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px;color:var(--muted);background:#fff}

.app{display:grid;grid-template-rows:52px 1fr;height:100vh}
.top{display:flex;align-items:center;gap:12px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:14px}
.top .name{font-weight:600}
.tabs{display:flex;gap:4px;margin-left:6px}
.backlink{font-size:12px;color:var(--muted);text-decoration:none;border:1px solid var(--line2);border-radius:8px;padding:3px 10px;margin-left:10px}
.backlink:hover{color:var(--accent);border-color:var(--accent)}
.tab{padding:5px 12px;border-radius:8px;color:var(--muted);font-size:13px}
.tab:hover{background:var(--bg)}
.tab.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.tab kbd{margin-right:6px}
.top .hint{margin-left:auto;color:var(--faint);font-size:12px}

.main{display:grid;grid-template-columns:clamp(290px,26vw,370px) 1fr;min-height:0}

/* 左：分身 */
.me{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.me-head{display:flex;align-items:center;gap:12px;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;flex:none;position:relative}
.me-head .av{background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff}
.me-head .av::after{content:"";position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#22c55e;border:2px solid #fff}
.me-head b{display:block;font-size:15px}
.me-head span{font-size:12px;color:var(--muted)}
.me-body{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.idle{margin:auto 0;text-align:center;color:var(--muted);font-size:13px}
.idle h2{font-size:16px;color:var(--text);margin-bottom:6px}
.bub{max-width:94%;padding:8px 12px;font-size:13px;opacity:0;transform:translateY(6px);transition:.35s}
.bub.in{opacity:1;transform:none}
.bub.u{align-self:flex-end;background:var(--bg);border-radius:14px 14px 4px 14px}
.bub.a{align-self:flex-start;background:var(--accent-bg);border-radius:14px 14px 14px 4px}
.plan{display:flex;flex-direction:column;gap:6px}
.pl{display:flex;align-items:center;gap:8px;font-size:12px;padding:5px 10px;line-height:1.4;border:1px solid var(--line);border-radius:8px;background:#fff;opacity:0;transform:translateX(-8px);transition:.35s}
.pl.in{opacity:1;transform:none}
.pl .dot{width:8px;height:8px;border-radius:50%;flex:none}
.pl .to{margin-left:auto;font-size:11px;color:var(--faint);white-space:nowrap}
.pl.done .to{color:var(--ok)}
.rv{border:1px solid #f3d9a8;background:var(--todo-bg);border-radius:10px;padding:10px 12px;opacity:0;transform:translateY(6px);transition:.4s}
.rv.in{opacity:1;transform:none}
.rv h4{font-size:12.5px;color:var(--todo);margin-bottom:6px}
.rv li{list-style:none;display:flex;align-items:center;gap:8px;font-size:12px;padding:3px 0;border-top:1px dashed #efd3a0}
.rv li:first-of-type{border-top:0}
.rv .btn{margin-left:auto;font-size:11px;border:1px solid var(--todo);color:var(--todo);border-radius:999px;padding:1px 10px;background:#fff;white-space:nowrap}
.inbar{border-top:1px solid var(--line);padding:12px 14px;display:flex;gap:8px;align-items:center}
.inp{flex:1;min-height:40px;border:1px solid var(--line2);border-radius:10px;padding:9px 12px;font-size:13px;color:var(--text);background:#fff}
.inp.ph{color:var(--faint)}
.go{background:var(--accent);color:#fff;border-radius:10px;padding:9px 14px;font-size:13px;white-space:nowrap;opacity:.45}
.go.ready{opacity:1}

/* 右：チーム */
.team{padding:14px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;min-height:0;position:relative}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;overflow:hidden;transition:border-color .3s, box-shadow .3s}
.card.run{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 14%,transparent)}
.card.done{cursor:pointer}
.card.done:hover{border-color:var(--c)}
.ch{display:flex;align-items:center;gap:10px;padding:10px 14px 8px}
.ch .av{width:36px;height:36px;font-size:18px;background:color-mix(in srgb,var(--c) 14%,#fff)}
.ch b{display:block;font-size:14px}
.ch small{display:block;font-size:11.5px;color:var(--muted);line-height:1.4}
.st{margin-left:auto;font-size:11px;border-radius:999px;padding:2px 10px;background:var(--bg);color:var(--faint);white-space:nowrap}
.card.run .st{background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c)}
.card.done .st{background:var(--ok-bg);color:var(--ok)}
.opn{display:none;font-size:11px;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,#fff);border-radius:999px;padding:1px 9px;margin-left:6px;white-space:nowrap}
.card.done .opn{display:inline-block}
.bar{height:3px;background:var(--line);margin:0 14px}
.bar i{display:block;height:100%;width:0;background:var(--c);transition:width .6s ease}
.logs{position:relative;height:26px;margin:6px 14px 0;font-size:11.5px;color:var(--muted)}
.lg{position:absolute;inset:0;display:flex;gap:6px;opacity:0;transform:translateY(4px);transition:.3s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg.in{opacity:1;transform:none}
.lg.gone{opacity:0;transform:translateY(-4px)}
.lg::before{content:"›";color:var(--c)}
.out{flex:1;margin:4px 14px 14px;border-radius:10px;background:var(--bg);border:1px dashed var(--line2);position:relative;overflow:hidden;min-height:0}
.out .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:12px;text-align:center;padding:8px}
.out .res{position:absolute;inset:0;padding:10px 12px;opacity:0;transform:scale(.97);transition:.5s;overflow:hidden}
.out.in{border-style:solid;background:#fff}
.out.in .res{opacity:1;transform:none}
.out.in .ph{opacity:0}

/* 調べている最中 */
.scan{width:100%;font-size:11.5px;color:var(--muted);text-align:left}
.scan .cnt{display:flex;align-items:baseline;gap:6px;margin-bottom:6px;color:var(--text)}
.scan .cnt b{font-size:22px;color:var(--c);font-variant-numeric:tabular-nums}
.scan .src{display:flex;gap:6px;align-items:center;padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scan .src i{font-style:normal;font-size:10px;border-radius:4px;padding:0 5px;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c);flex:none}
.scan .src:first-of-type{color:var(--text)}

/* 成果物の部品（カード内） */
.r-t{font-size:11px;color:var(--faint);margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.stats{display:flex;gap:6px;margin-bottom:6px}
.stats div{flex:1;background:var(--bg);border-radius:6px;padding:3px 8px;font-size:10.5px;color:var(--muted);line-height:1.3}
.stats b{display:block;font-size:15px;color:var(--text)}
.finds li{list-style:none;display:flex;gap:6px;align-items:flex-start;font-size:12px;padding:2px 0;line-height:1.45}
.finds li span{flex:none;width:16px;height:16px;border-radius:50%;background:var(--c);color:#fff;font-size:10px;display:grid;place-items:center;margin-top:1px}
.chart{display:flex;align-items:flex-end;gap:12px;height:calc(100% - 46px);padding:0 6px;border-bottom:1px solid var(--line2)}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--muted)}
.chart i{display:block;width:70%;border-radius:5px 5px 0 0;background:color-mix(in srgb,var(--c) 45%,#fff);height:0;transition:height .8s ease}
.chart div:last-child i{background:var(--c)}
.chart em{font-style:normal;font-size:11px;color:var(--text);margin-bottom:2px}
.cap{font-size:11px;color:var(--muted);margin-top:4px}
.slides{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;height:calc(100% - 22px)}
.sl{border-radius:6px;border:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:5px;font-size:10px;background:#fff}
.sl:first-child{background:#1e1b4b;color:#fff;border-color:#1e1b4b}
.sl b{font-size:11px;line-height:1.35}
.sl i{display:block;height:5px;border-radius:3px;background:var(--line)}
.sl:first-child i{background:#4338ca}
.sl .mini{display:flex;align-items:flex-end;gap:3px;height:34px;margin-top:auto}
.sl .mini span{flex:1;background:#c7d2fe;border-radius:2px 2px 0 0}
.mhd{font-size:11px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:5px;line-height:1.55}
.mhd b{color:var(--text);font-weight:600}
.mbd{font-size:11.5px;line-height:1.6}
.att{display:inline-flex;gap:4px;align-items:center;font-size:10.5px;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin:4px 4px 0 0;background:var(--bg)}
.tbars li{list-style:none;display:grid;grid-template-columns:118px 1fr 40px;gap:6px;align-items:center;font-size:11px;padding:2px 0}
.tbars li i{display:block;height:9px;border-radius:5px;background:color-mix(in srgb,var(--c) 30%,#fff)}
.tbars li.best i{background:var(--c)}
.tbars li.best{font-weight:600}
.tbars em{font-style:normal;text-align:right;color:var(--muted)}
.reco{margin-top:6px;font-size:11.5px;background:color-mix(in srgb,var(--c) 9%,#fff);border-radius:6px;padding:4px 8px}
.txt{font-size:11.5px;line-height:1.65}
.txt .tag{color:var(--accent)}
.covers{display:flex;gap:8px;height:calc(100% - 22px);justify-content:center}
.covers svg{height:100%;width:auto;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.sched li{list-style:none;display:flex;align-items:center;gap:8px;font-size:11.5px;padding:2px 0;border-top:1px solid var(--line)}
.sched li:first-child{border-top:0}
.sched b{width:22px;color:var(--c)}
.sched .tm{width:38px;color:var(--muted);font-variant-numeric:tabular-nums}
.sched .ok{margin-left:auto;font-size:10px;border-radius:999px;padding:0 8px;background:var(--ok-bg);color:var(--ok);white-space:nowrap}
.rep li{list-style:none;font-size:11.5px;padding:3px 0;line-height:1.5;border-top:1px solid var(--line)}
.rep li:first-child{border-top:0}
.rep .q{color:var(--muted)}
.rep .q::before{content:"💬 "}
.rep .ans{display:block;padding-left:12px;border-left:2px solid var(--c);margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.kpi small{display:block;font-size:10.5px;color:var(--muted)}
.kpi b{font-size:17px}
.kpi em{font-style:normal;font-size:10.5px;margin-left:4px}
.up{color:var(--ok)} .dn{color:#b91c1c}
.note{margin-top:6px;font-size:11.5px;background:var(--todo-bg);border-radius:6px;padding:5px 8px;color:#7c4a03}
.spark{display:flex;align-items:flex-end;gap:3px;height:26px;margin-top:6px}
.spark i{flex:1;background:color-mix(in srgb,var(--c) 40%,#fff);border-radius:2px 2px 0 0}
.shift{width:100%;border-collapse:collapse;font-size:11px}
.shift th,.shift td{border:1px solid var(--line);padding:3px 4px;text-align:center}
.shift th{background:var(--bg);font-weight:600;color:var(--muted)}
.shift td.o{background:color-mix(in srgb,var(--c) 18%,#fff);color:var(--c);font-weight:600}
.job b{display:block;font-size:13px;margin-bottom:3px}
.job .tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:5px}
.job .tags span{font-size:10.5px;background:var(--bg);border-radius:999px;padding:1px 8px;color:var(--muted)}
.job p{font-size:11.5px;color:var(--muted)}

/* 開いたとき */
.modal{position:fixed;inset:0;background:rgba(20,18,40,.45);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.3s;z-index:20}
.modal.in{opacity:1;pointer-events:auto}
.sheet{width:min(920px,92vw);max-height:88vh;background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;transform:translateY(12px);transition:.3s;overflow:hidden}
.modal.in .sheet{transform:none}
.sh-hd{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line)}
.sh-hd .av{width:34px;height:34px;font-size:17px;background:color-mix(in srgb,var(--c) 14%,#fff)}
.sh-hd b{font-size:15px}
.sh-hd small{color:var(--muted);font-size:12px;margin-left:6px}
.sh-hd .x{margin-left:auto;color:var(--faint);font-size:12px}
.sh-bd{padding:20px 24px 24px;overflow:auto}
.sh-bd h5{font-size:13px;color:var(--c);margin:16px 0 8px;letter-spacing:.04em}
.sh-bd h5:first-child{margin-top:0}

/* 調査レポート */
.scope{display:grid;grid-template-columns:repeat(4,1fr) 1.3fr;gap:8px}
.scope div{background:var(--bg);border-radius:8px;padding:8px 10px;font-size:11.5px;color:var(--muted);line-height:1.4}
.scope b{display:block;font-size:20px;color:var(--text)}
.scope .sum{background:color-mix(in srgb,var(--c) 10%,#fff);color:var(--text)}
.scope .sum b{color:var(--c)}
.fd{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;display:grid;grid-template-columns:30px 1fr;gap:4px 10px}
.fd .n{grid-row:span 3;width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.fd .h{font-weight:700;font-size:14.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.conf{font-size:10.5px;font-weight:600;border-radius:999px;padding:0 8px;background:var(--ok-bg);color:var(--ok)}
.conf.mid{background:var(--todo-bg);color:var(--todo)}
.fd ul{font-size:12.5px;color:#3d3c38}
.fd li{list-style:none;padding:1px 0;display:flex;gap:6px;align-items:baseline}
.fd li::before{content:"・";color:var(--faint)}
.fd li .s{font-size:10.5px;border-radius:4px;padding:0 5px;background:var(--bg);color:var(--muted);white-space:nowrap;margin-left:auto}
.fd .ac{font-size:12.5px;background:color-mix(in srgb,var(--c) 8%,#fff);border-radius:6px;padding:5px 10px}
.fd .ac::before{content:"会議での論点 → ";color:var(--c);font-weight:600}
.foot{font-size:11px;color:var(--faint);margin-top:4px}

/* メール */
.mail{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mail .hd{background:var(--bg);padding:10px 16px;font-size:12.5px;display:grid;grid-template-columns:52px 1fr;gap:3px 8px}
.mail .hd span{color:var(--muted)}
.mail .hd .sub{font-weight:700;font-size:14px}
.mail .bd{padding:16px 20px;font-size:13.5px;line-height:1.85}
.mail .bd p{margin-bottom:10px}
.mail .blk{margin:6px 0 12px}
.mail .blk b{display:block}
.agenda{border-collapse:collapse;font-size:12.5px;margin:4px 0 0;width:100%}
.agenda td,.agenda th{border:1px solid var(--line);padding:5px 10px;text-align:left}
.agenda th{background:var(--bg);font-weight:600;color:var(--muted);font-size:11.5px}
.sig{border-top:1px solid var(--line);margin-top:12px;padding-top:8px;font-size:12px;color:var(--muted);line-height:1.6}
.mail .ft{border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;align-items:center}
.mail .ft .att{font-size:12px;padding:3px 10px;margin:0}
.mail .ft .hold{margin-left:auto;font-size:12px;color:var(--todo);background:var(--todo-bg);border-radius:999px;padding:2px 12px}

/* SNS分析 */
.ana{width:100%;border-collapse:collapse;font-size:12.5px}
.ana th,.ana td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left}
.ana th{font-size:11px;color:var(--muted);font-weight:600}
.ana td.num{text-align:right;font-variant-numeric:tabular-nums}
.ana tr.best td{background:color-mix(in srgb,var(--c) 7%,#fff);font-weight:600}
.ana .barc{width:140px}
.ana .barc i{display:block;height:8px;border-radius:4px;background:color-mix(in srgb,var(--c) 35%,#fff)}
.ana tr.best .barc i{background:var(--c)}
.hint2{display:flex;gap:8px;margin-top:10px}
.hint2 div{flex:1;background:var(--bg);border-radius:8px;padding:8px 12px;font-size:12px}
.hint2 b{display:block;font-size:13px}
.week{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.day{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;display:flex;flex-direction:column;gap:4px}
.day .d{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}
.day .d b{color:var(--c)}
.day .tt{font-weight:700;font-size:13px;line-height:1.4}
.day .ty{font-size:10.5px;border-radius:4px;padding:0 6px;background:color-mix(in srgb,var(--c) 10%,#fff);color:var(--c);align-self:flex-start}
.day .why{font-size:11px;color:var(--muted);line-height:1.5}

/* 表紙・投稿 */
.covers-big{display:flex;gap:18px;justify-content:center}
.covers-big figure{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.covers-big svg{width:220px;height:auto;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.covers-big figure b{color:var(--text)}
.post{display:grid;grid-template-columns:290px 1fr;gap:24px;align-items:start}
.phone{border:8px solid #1f1f1d;border-radius:28px;overflow:hidden;background:#fff;font-size:11.5px}
.phone .pt{display:flex;align-items:center;gap:8px;padding:8px 10px}
.phone .pt i{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#db2777);display:block}
.phone .pt b{font-size:12px}
.phone svg{display:block;width:100%;height:auto}
.phone .pa{padding:6px 10px;display:flex;gap:12px;font-size:15px}
.phone .pc{padding:0 10px 12px;line-height:1.6}
.phone .pc .tag{color:#2563eb}
.qlist li{list-style:none;display:grid;grid-template-columns:34px 52px 1fr auto;gap:8px;align-items:center;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line)}
.qlist b{color:var(--c)}
.qlist .tm{color:var(--muted);font-variant-numeric:tabular-nums}
.qlist .ok{font-size:11px;border-radius:999px;padding:1px 10px;background:var(--todo-bg);color:var(--todo);white-space:nowrap}
.flow{margin-top:14px;display:flex;gap:6px;align-items:center;font-size:12px;flex-wrap:wrap}
.flow span{background:var(--bg);border-radius:999px;padding:3px 10px}
.flow span.me{background:var(--todo-bg);color:var(--todo);font-weight:600}
.big{zoom:1.35}

/* 経理 */
.inv-al{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.inv-al div{border:1px solid #f3d9a8;background:#fffaf0;border-radius:10px;padding:10px 12px;font-size:12px;color:#5c4a33;line-height:1.6}
.inv-al b{display:block;font-size:13.5px;color:var(--text);margin:4px 0 2px}
.inv-al .lb{font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--todo-bg);color:var(--todo)}

           <dl><dt>給与</dt><dd>時給 ¥1,200〜（研修中も同じ）</dd><dt>勤務日</dt><dd>土・日・祝 から週1日〜</dd><dt>時間</dt><dd>9:30〜17:00 の間で4時間〜</dd><dt>場所</dt><dd>○○駅 徒歩3分</dd><dt>待遇</dt><dd>まかない無料／交通費支給／制服貸与</dd></dl>
           <div class="jp-voice"><b>💬 先輩スタッフの声</b>「最初の1か月は必ず先輩と一緒なので、未経験でも安心でした」（大学2年・林）</div>
           <div class="jp-apply">応募する</div>
         </div>
       </div>
       <div class="jp-out"><b>そのまま使える形でも用意しました：</b><span>求人サイト用（文字数に合わせて調整）</span><span>お店のインスタ投稿用</span><span>店内に貼るポスター（A4）</span><span class="hold">⏸ 公開は鈴木さんの確認待ち</span></div>
     </div>`},
  ]
}];

// 文章AIの「開く」：5日分の文章
TEAMS[1].members[1].full = ()=>`<h5>5日分の投稿文</h5><div class="week">${[
 ["月","日曜に30分だけ。平日がぐっとラクになる「作り置き3品」を紹介します🍲 どれも冷蔵で3日OK。忙しい週の味方です。","#作り置き #平日ごはん"],
 ["火","帰ってから10分。鶏むねがしっとり仕上がる主菜です🐔 火を止めてから余熱で仕上げるのがコツ。","#時短レシピ #鶏むね"],
 ["水","さつまいもの甘煮、煮くずれしたことありませんか？ 失敗しないコツは「水から弱火」。コメントで皆さんのコツも教えてください🍠","#失敗しないコツ #秋レシピ"],
 ["木","来週の作り置き献立、買い物リストつきでまとめました📝 保存して、週末の買い物にどうぞ。","#作り置き献立 #買い物リスト"],
 ["金","今週の教室では、作り置き3品を一緒に作りました。次回は12月のクリスマス料理です🎄 詳しくはプロフィールから。","#料理教室 #おうちごはん"]
].map(d=>`<div class="day"><div class="d"><b>${d[0]}曜</b></div><div style="font-size:12px;line-height:1.65">${d[1]}</div><div style="font-size:11px;color:var(--accent)">${d[2]}</div></div>`).join("")}</div>`;

// ====== 画面づくり ======
function renderTabs(){
  $("tabs").innerHTML = TEAMS.map((t,i)=>`<button class="tab${i===cur?" on":""}" data-i="${i}"><kbd>${i+1}</kbd>${t.tab}</button>`).join("");
  $("tabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{ cur=+b.dataset.i; reset(); });
}
function closeModal(){ $("modal").classList.remove("in"); }
function openMember(i){
  const T=TEAMS[cur], m=T.members[i];
  const body = m.full ? m.full() : `<div class="big">${m.out()}</div>`;
  $("sheet").style.setProperty("--c", m.c);
  $("sheet").innerHTML = `<div class="sh-hd"><div class="av">${m.icon}</div><b>${m.name}</b><small>${m.task}</small><span class="x">Esc / 外側クリックで閉じる</span></div><div class="sh-bd" style="--c:${m.c}">${body}</div>`;
  $("sheet").querySelectorAll(".chart i").forEach(b=>b.style.height=b.dataset.h+"%");
  $("modal").classList.add("in");
}
function reset(){
  timers.forEach(clearTimeout); timers=[]; state="idle"; closeModal();
  const T = TEAMS[cur];
  renderTabs();
  $("meAv").textContent = T.meIcon;
  $("meName").textContent = T.owner + "の分身AI";
  $("thread").innerHTML = `<div class="idle"><h2>${T.owner}のAIチーム</h2>4人のAIが待機しています。<br><kbd>Enter</kbd> で分身AIに仕事を頼みます</div>`;
  $("inp").className="inp ph"; $("inp").textContent="分身AIに頼みたいことを入力…";
  $("go").className="go";
  $("team").innerHTML = T.members.map((m,i)=>`
    <div class="card" id="m${i}" style="--c:${m.c}">
      <div class="ch"><div class="av">${m.icon}</div><div><b>${m.name}</b><small>${m.role}</small></div><span class="st">待機中</span><span class="opn">開く ↗</span></div>
      <div class="bar"><i></i></div>
      <div class="logs">${m.logs.map(l=>`<div class="lg">${l}</div>`).join("")}</div>
      <div class="out"><div class="ph">まだ仕事を受けていません</div><div class="res">${m.out()}</div></div>
    </div>`).join("") + `
    <div class="back" id="back">
      <h3>このチームを動かしているのは、3つの力です</h3>
      <div class="lead">AIが勝手に動いているように見えて、うしろでは人がこの3つを決めています</div>
      <div class="skills">
        <div class="sk"><span>🧩</span><b>仕事を分けて任せる力</b><p>どの仕事を、どのAIに、どの順番で任せるかを決める</p></div>
        <div class="sk"><span>🗣</span><b>AIに伝える力</b><p>材料・目的・できあがりの形を、AIに分かる言葉で渡す</p></div>
        <div class="sk"><span>✅</span><b>仕上がりを確かめる力</b><p>外に出す前に、人が見て直す。最後に決めるのは自分</p></div>
      </div>
      <div class="ask">${T.owner}の仕事なら、どんなAIを並べたいですか？</div>
    </div>`;
  T.members.forEach((m,i)=>{ $("m"+i).onclick=()=>{ if($("m"+i).classList.contains("done")) openMember(i); }; });
}

function typePrompt(){
  state="typed";
  const T=TEAMS[cur], el=$("inp"); el.className="inp"; el.textContent="";
  [...T.prompt].forEach((ch,i)=>at(i*35, ()=>el.textContent+=ch));
  at(T.prompt.length*35, ()=>$("go").classList.add("ready"));
}

function scanView(sc, n, k){
  const shown = [0,1,2].map(j=>sc.items[(k+j)%sc.items.length]);
  return `<div class="scan"><div class="cnt"><b>${n}</b>件 ${sc.label}</div>${shown.map(s=>`<div class="src"><i>${s[0]}</i>${s[1]}</div>`).join("")}</div>`;
}

function run(){
  if(state!=="typed") return;
  state="running";
  const T=TEAMS[cur], th=$("thread");
  timers.forEach(clearTimeout); timers=[];
  $("inp").className="inp ph"; $("inp").textContent="分身AIがチームに指示しています…"; $("go").className="go";
  th.innerHTML = `<div class="bub u">${T.prompt}</div><div class="bub a">${T.intro}</div>
    <div class="plan">${T.members.map((m,i)=>`<div class="pl" id="p${i}"><span class="dot" style="background:${m.c}"></span>${m.task}<span class="to">→ ${m.name}</span></div>`).join("")}</div>`;
  const bubs=th.querySelectorAll(".bub");
  at(100, ()=>bubs[0].classList.add("in"));
  at(700, ()=>bubs[1].classList.add("in"));

  // 仕事を配る → 同時に進む。前のAIの結果を使うAIほど、あとで仕上がる
  const START=[1300,1550,1800,2050], FIN=T.fin||[5200,4300,6600,7600];
  T.members.forEach((m,i)=>{
    const card=$("m"+i), bar=card.querySelector(".bar i"), lgs=card.querySelectorAll(".lg"), st=card.querySelector(".st"), out=card.querySelector(".out"), ph=out.querySelector(".ph");
    at(START[i], ()=>{ $("p"+i).classList.add("in"); card.classList.add("run"); st.textContent="作業中"; ph.textContent = m.scan ? "" : "つくっています…"; bar.style.width="10%"; });
    lgs.forEach((l,k)=>{
      const t = START[i] + 300 + (FIN[i]-START[i]-300)*k/lgs.length;
      at(t, ()=>{ if(k>0) lgs[k-1].classList.add("gone"); l.classList.add("in"); bar.style.width = (10 + 90*(k+1)/lgs.length) + "%"; });
    });
    if(m.scan){
      const steps = Math.floor((FIN[i]-START[i]-200)/110);
      for(let k=0;k<steps;k++){
        at(START[i]+100+k*110, ()=>{ ph.innerHTML = scanView(m.scan, Math.round(m.scan.total*Math.min(1,(k+1)/(steps*0.8))), k); });
      }
    }
    at(FIN[i], ()=>{
      card.classList.remove("run"); card.classList.add("done"); st.textContent="できました";
      out.classList.add("in");
      out.querySelectorAll(".chart i").forEach(b=>setTimeout(()=>b.style.height=b.dataset.h+"%",100));
      const p=$("p"+i); p.classList.add("done"); p.querySelector(".to").textContent="✓ "+m.name;
    });
  });

  at(8200, ()=>{
    const d=document.createElement("div"); d.className="bub a"; d.textContent=T.done; th.appendChild(d);
    requestAnimationFrame(()=>d.classList.add("in"));
  });
  at(8800, ()=>{
    const r=document.createElement("div"); r.className="rv";
    r.innerHTML=`<h4>⏸ ${T.owner}の確認待ち</h4><ul>${T.review.map(x=>`<li>${x[0]} ${x[1]}<span class="btn">${x[2]}</span></li>`).join("")}</ul>`;
    th.appendChild(r); requestAnimationFrame(()=>r.classList.add("in"));
  });
  at(9200, ()=>{ state="done"; $("inp").textContent="カードをクリックで中身を見る ／ Enter で裏側へ"; });
}

function showBack(){ state="back"; $("back").classList.add("in"); }

$("modal").onclick = e=>{ if(e.target.id==="modal") closeModal(); };
document.addEventListener("keydown", e=>{
  if($("modal").classList.contains("in")){ if(e.key==="Escape"||e.key==="Enter"){ e.preventDefault(); closeModal(); } return; }
  if(e.key==="Enter"){
    e.preventDefault();
    if(state==="idle") typePrompt();
    else if(state==="typed") run();
    else if(state==="done") showBack();
    else if(state==="back"){ $("back").classList.remove("in"); state="done"; }
  } else if(["1","2","3"].includes(e.key)){ cur=+e.key-1; reset(); }
  else if(e.key==="r"||e.key==="R"){ reset(); }
});
$("go").onclick=()=>{ if(state==="typed") run(); else if(state==="idle") typePrompt(); };
reset();
</script>
</body>
</html>
