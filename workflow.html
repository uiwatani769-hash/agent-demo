<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>自動ワークフロー デモ</title>
<style>
:root{
  --bg:#f6f5f2; --panel:#fff; --line:#e7e5df; --line2:#d9d6ce;
  --text:#1f1f1d; --muted:#6c6b66; --faint:#a3a19a;
  --accent:#4f46e5; --accent-bg:#eef0ff;
  --ok:#15803d; --ok-bg:#e7f6ec;
  --todo:#b45309; --todo-bg:#fdf1de;
  --c0:#dc2626; --c1:#0f9488; --c2:#7c3aed;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
kbd{font-family:inherit;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px;color:var(--muted);background:#fff}

.app{display:grid;grid-template-rows:52px 1fr;height:100vh}
.top{display:flex;align-items:center;gap:10px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:14px}
.top .name{font-weight:600;white-space:nowrap}
.navl{white-space:nowrap;font-size:12px;color:var(--muted);text-decoration:none;border:1px solid var(--line2);border-radius:8px;padding:3px 10px}
.navl:hover{color:var(--accent);border-color:var(--accent)}
.tabs{display:flex;gap:4px;margin-left:6px}
.tab{white-space:nowrap;padding:5px 10px;border-radius:8px;color:var(--muted);font-size:13px}
.tab:hover{background:var(--bg)}
.tab.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.tab kbd{margin-right:6px}
.top .hint{margin-left:auto;color:var(--faint);font-size:12px;white-space:nowrap}

.main{display:grid;grid-template-columns:1fr clamp(300px,26vw,360px);min-height:0}

/* キャンバス */
.cv{position:relative;min-height:0;overflow:hidden;background:
  radial-gradient(circle, #dcd9d1 1px, transparent 1px) 0 0/22px 22px, var(--bg)}
.cv-hd{position:absolute;left:20px;top:14px;right:20px;display:flex;align-items:center;gap:12px;z-index:3}
.cv-hd h2{font-size:16px}
.cv-hd small{color:var(--muted);font-size:12px}
.sw{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 6px}
.sw i{width:34px;height:20px;border-radius:999px;background:var(--line2);position:relative;transition:.3s}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.3s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{color:var(--ok);border-color:#bfe3c9}
.sw.on i{background:#22c55e}
.sw.on i::after{left:16px}
.stage{position:absolute;left:0;top:0;width:1000px;height:560px;transform-origin:0 0}
.stage svg.edges{position:absolute;inset:0;width:1000px;height:560px;overflow:visible}
.edge{fill:none;stroke:#cfccc3;stroke-width:2.5}
.edge.hot{stroke:var(--ec,#6366f1);stroke-width:3}
.elab{position:absolute;font-size:11.5px;font-weight:700;padding:1px 9px;border-radius:999px;background:#fff;border:1.5px solid var(--ec);color:var(--ec);transform:translate(-50%,-50%);white-space:nowrap}
.node{position:absolute;background:#fff;border:1.5px solid var(--line2);border-radius:14px;padding:10px 10px;display:flex;gap:8px;align-items:center;box-shadow:0 2px 6px rgba(0,0,0,.04);transition:border-color .25s, box-shadow .25s, transform .25s}
.node .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:17px;background:var(--bg);flex:none}
.node b{display:block;font-size:13px;line-height:1.35;white-space:nowrap}
.node small{display:block;font-size:11px;color:var(--muted);line-height:1.35}
.node .cnt{position:absolute;top:-10px;right:-8px;min-width:24px;height:22px;border-radius:999px;background:var(--text);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center;padding:0 7px;opacity:0;transform:scale(.6);transition:.25s}
.node .cnt.on{opacity:1;transform:none}
.node.flash{border-color:var(--nc,#6366f1);box-shadow:0 0 0 5px color-mix(in srgb,var(--nc,#6366f1) 16%,transparent);transform:translateY(-1px)}
.node.trig .ic{background:#fff7ed}
.node.ai .ic{background:var(--accent-bg)}
.node.br{justify-content:center;border-style:dashed}
.node.br .ic{background:#f5f3ff}
.node.act0{--nc:var(--c0)} .node.act0 .ic{background:#fef2f2}
.node.act1{--nc:var(--c1)} .node.act1 .ic{background:#ecfdf5}
.node.act2{--nc:var(--c2)} .node.act2 .ic{background:#f5f3ff}
.node.rec .ic{background:#eff6ff}
.peek{position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);width:230px;background:#1f1f1d;color:#fff;font-size:11.5px;border-radius:8px;padding:6px 10px;line-height:1.5;opacity:0;transition:.2s;pointer-events:none;z-index:5}
.peek.on{opacity:1}
.peek em{font-style:normal;color:#a5b4fc}
.cv.done .node{cursor:pointer}
.cv.done .node:hover{border-color:var(--accent)}
.opn{display:none;position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);font-size:10.5px;background:#fff;border:1px solid var(--line2);border-radius:999px;padding:0 8px;color:var(--muted);white-space:nowrap}
.cv.done .opn{display:block}

/* 右：ログ */
.side{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.sd-hd{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sd-hd b{font-size:14px}
.sd-hd small{display:block;color:var(--muted);font-size:11.5px}
.ctr{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.ctr div{background:var(--bg);border-radius:8px;padding:4px 6px;font-size:10px;color:var(--muted);line-height:1.3;text-align:center}
.ctr b{display:block;font-size:18px;color:var(--text);font-variant-numeric:tabular-nums}
.ctr .k0 b{color:var(--c0)} .ctr .k1 b{color:var(--c1)} .ctr .k2 b{color:var(--c2)}
.log{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.lempty{margin:auto;color:var(--faint);font-size:12.5px;text-align:center}
.row{border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12px;opacity:0;transform:translateY(-6px);transition:.35s;background:#fff}
.row.in{opacity:1;transform:none}
.row .t{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:10.5px}
.row .t .tg{font-weight:700;border-radius:999px;padding:0 7px;color:#fff}
.row .q{margin:2px 0;line-height:1.45}
.row .r{font-size:11px;color:var(--muted)}
.row .r::before{content:"→ "}
.row .hold{color:var(--todo)}
.sd-ft{border-top:1px solid var(--line);padding:10px 14px;font-size:12px;color:var(--muted)}
.sd-ft.ok{background:var(--ok-bg);color:var(--ok);font-weight:600}

/* できあがったもの（トレイ） */
.tray{flex:1;overflow:auto;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}
.tray .lempty{grid-column:1/-1;margin:60px auto 0}
.oc{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.07);font-size:10px;line-height:1.45;height:124px;display:flex;flex-direction:column;text-align:left}
.oc .oh{display:flex;align-items:center;gap:5px;padding:4px 7px;border-bottom:1px solid var(--line);font-size:9.5px;color:var(--muted);white-space:nowrap}
.oc .oh .tg{font-weight:700;border-radius:999px;padding:0 6px;color:#fff;font-size:9px}
.oc .oh .ty{margin-left:auto;font-weight:600;color:var(--text)}
.oc .ob{padding:6px 8px;flex:1;overflow:hidden;position:relative}
.oc.ph{visibility:hidden}
.oc.land{animation:land .35s ease}
@keyframes land{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:none}}
.fly{position:fixed;z-index:40;transition:left .6s cubic-bezier(.5,0,.2,1),top .6s cubic-bezier(.5,0,.2,1),transform .4s cubic-bezier(.3,1.4,.5,1),opacity .25s;transform-origin:center;pointer-events:none}
.fly .oc{box-shadow:0 10px 30px rgba(0,0,0,.22)}
/* 縮小版の成果物 */
.m-mail .to{color:var(--muted);font-size:9px}
.m-mail .s{font-weight:700;font-size:10.5px;margin:1px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-mail .b{color:#3d3c38;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.m-mail .st,.m-dm .st,.m-tk .st,.m-doc .st{position:absolute;right:6px;bottom:4px;font-size:8.5px;font-weight:700;border-radius:999px;padding:0 6px;background:var(--todo-bg);color:var(--todo)}
.st.sent{background:var(--ok-bg)!important;color:var(--ok)!important}
.m-doc{border:1px solid var(--line);border-radius:4px;padding:5px 7px 14px;height:100%;background:#fff}
.m-doc h6{text-align:center;font-size:10.5px;letter-spacing:.25em;margin-bottom:2px}
.m-doc .w{font-size:9px;font-weight:700;border-bottom:1px solid var(--text);display:inline-block;margin-bottom:3px}
.m-doc .ln{display:flex;justify-content:space-between;font-size:8.5px;color:var(--muted);border-bottom:1px solid var(--line);padding:1px 0}
.m-doc .tt{display:flex;justify-content:space-between;font-weight:700;font-size:10.5px;margin-top:3px}
.m-chat{display:flex;gap:5px}
.m-chat .av{width:18px;height:18px;border-radius:5px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:10px;flex:none}
.m-chat .bb{border:1px solid var(--line);border-left:3px solid var(--c0);border-radius:6px;padding:4px 6px;flex:1;background:#fffafa}
.m-chat .h{color:var(--c0);font-weight:700}
.m-chat .bt{display:flex;gap:4px;margin-top:3px}
.m-chat .bt span{font-size:8.5px;border:1px solid var(--line2);border-radius:4px;padding:0 5px;background:#fff}
.m-dm .u{font-weight:700;font-size:9.5px;display:flex;align-items:center;gap:4px}
.m-dm .u i{width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#db2777);display:block}
.m-dm .q{color:var(--muted);font-size:9px;margin:2px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-dm .a{background:var(--bg);border-radius:8px 8px 8px 2px;padding:3px 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.m-dm .ch{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px}
.m-dm .ch span{font-size:8.5px;border-radius:4px;padding:0 5px;background:#fdf2f8;color:#be185d;font-weight:600}
.m-tk{border:1.5px dashed var(--line2);border-radius:6px;padding:4px 7px;height:100%;background:#fffdf7}
.m-tk .ic{font-size:16px;float:right}
.m-tk .h{font-weight:700;font-size:10.5px}
.m-tk ul{margin-top:2px}
.m-tk li{list-style:none;font-size:9px;color:#3d3c38}
.m-tk li::before{content:"・"}
.m-seat .g{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin:3px 0 4px}
.m-seat .g i{display:block;height:12px;border-radius:3px;background:var(--line)}
.m-seat .g i.on{background:var(--c2)}
.m-seat .h{font-weight:700;font-size:10.5px}
.m-seat .x{font-size:9px;color:#3d3c38}
.m-seat .x b{color:#b91c1c}
/* 最後の一覧 */
.fin{position:absolute;inset:0;z-index:8;background:rgba(246,245,242,.97);display:flex;flex-direction:column;padding:22px 28px 34px;opacity:0;pointer-events:none;transition:.45s}
.fin.in{opacity:1;pointer-events:auto}
.fin-hd{display:flex;align-items:flex-end;gap:8px 14px;margin-bottom:12px;flex-wrap:wrap}
.fin-hd h3{white-space:nowrap}
.fin-hd h3{font-size:21px}
.fin-hd small{color:var(--muted);font-size:12.5px}
.fin-hd .chips{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.fin-hd .chips span{font-size:12px;font-weight:700;border-radius:999px;padding:3px 11px;color:#fff;white-space:nowrap}
.fin-hd .cls{white-space:nowrap;font-size:12px;color:var(--muted);border:1px solid var(--line2);border-radius:8px;padding:3px 10px;background:#fff}
.fin-g{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;gap:14px;min-height:0}
.fin-g .cell{min-height:0;opacity:0;transform:translateY(10px) scale(.96);transition:.4s;cursor:pointer}
.fin.in .fin-g .cell{opacity:1;transform:none}
.fin-g .cell{position:relative}
.fin-g .cell .oc{position:absolute;left:0;top:0;width:calc(100% / 1.3);height:calc(100% / 1.3);transform:scale(1.3);transform-origin:0 0}
.fin-g .cell:hover .oc{border-color:var(--accent)}
.fin-ft{white-space:nowrap;overflow:hidden;margin-top:12px;font-size:12.5px;color:var(--muted);display:flex;gap:10px;align-items:center}
.fin-ft b{color:var(--todo)}

/* 夜に回るフロー */
.clock{display:none;align-items:center;gap:8px;font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 12px}
.clock b{font-size:18px;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.cv.hasclock .clock{display:flex}
.cv.hasclock .sw{margin-left:8px}
.cv{transition:background-color .9s}
.cv.night{background:radial-gradient(circle, #2b3152 1px, transparent 1px) 0 0/22px 22px, #121733}
.cv.night .cv-hd h2{color:#eef0ff}
.cv.night .cv-hd small{color:#a5b0d6}
.cv.night .edge{stroke:#3a4168}
.cv.night .clock{background:#1d2347;border-color:#353d6b;color:#a5b0d6}
.cv.night .clock b{color:#fde68a}
.cv.night .sw{background:#1d2347;border-color:#353d6b}
.cv.night .elab{background:#121733}
.cv.morning .clock b{color:#ea580c}
.nightnote{position:absolute;left:20px;bottom:16px;z-index:3;font-size:12px;color:#c7d2fe;background:rgba(29,35,71,.9);border:1px solid #353d6b;border-radius:10px;padding:6px 12px;display:none}
.cv.night .nightnote{display:block}
/* スカウト・見送りの縮小版 */
.m-sc .u{display:flex;align-items:center;gap:5px;font-weight:700;font-size:10px}
.m-sc .u i{width:16px;height:16px;border-radius:50%;background:#e0e7ff;display:grid;place-items:center;font-style:normal;font-size:8px;color:#4338ca}
.m-sc .mt{margin-left:auto;font-size:9px;font-weight:700;color:var(--c0);background:#fef2f2;border-radius:999px;padding:0 6px}
.m-sc .p{font-size:8.5px;color:var(--muted);margin:1px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-sc .msg{font-size:9px;background:var(--bg);border-radius:6px;padding:2px 5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.m-sc .rp{margin-top:3px;font-size:9px;border-left:2px solid var(--ok);padding-left:5px;color:#14532d}
.m-sc .mtg{margin-top:2px;font-size:9px;font-weight:700;color:#fff;background:var(--ok);border-radius:4px;padding:0 5px;display:inline-block}
.m-sc .mtg.q{background:var(--todo)}
.m-sk .u{font-weight:700;font-size:10px}
.m-sk .p{font-size:8.5px;color:var(--muted);margin-bottom:4px}
.m-sk .why{font-size:9.5px;background:#f5f3ff;border-radius:6px;padding:3px 6px;color:#4c1d95}
.m-sk .nx{font-size:9px;color:var(--muted);margin-top:4px}
.cal{display:grid;grid-template-columns:44px repeat(5,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:11.5px}
.cal div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 6px;min-height:30px}
.cal .hd{background:var(--bg);font-weight:600;color:var(--muted);text-align:center}
.cal .tm{color:var(--muted);font-size:10.5px;text-align:right}
.cal .ev{background:var(--ok-bg);color:var(--ok);font-weight:700;border-left:3px solid var(--ok)}
.cal .busy{background:#f3f4f6;color:var(--faint)}

/* 開いたとき */
.modal{position:fixed;inset:0;background:rgba(20,18,40,.45);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.3s;z-index:20}
.modal.in{opacity:1;pointer-events:auto}
.sheet{width:min(900px,92vw);max-height:88vh;background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;transform:translateY(12px);transition:.3s;overflow:hidden}
.modal.in .sheet{transform:none}
.sh-hd{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line)}
.sh-hd .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:18px;background:var(--bg)}
.sh-hd b{font-size:15px}
.sh-hd small{color:var(--muted);font-size:12px;margin-left:4px}
.sh-hd .x{margin-left:auto;color:var(--faint);font-size:12px}
.sh-bd{padding:18px 24px 24px;overflow:auto}
.sh-bd h5{font-size:13px;color:var(--accent);margin:14px 0 8px}
.sh-bd h5:first-child{margin-top:0}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th,.tbl td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:11px;color:var(--muted);font-weight:600}
.pill{font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;color:#fff;white-space:nowrap}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rule{border:1.5px solid var(--rc);border-radius:12px;padding:12px}
.rule b{color:var(--rc);font-size:14px}
.rule p{font-size:12.5px;margin-top:4px;line-height:1.7}
.rule .ex{font-size:11.5px;color:var(--muted);margin-top:6px}
.drafts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dr{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dr .q{background:var(--bg);padding:8px 12px;font-size:12px;color:var(--muted)}
.dr .q b{color:var(--text)}
.dr .a{padding:10px 12px;font-size:12.5px;line-height:1.75}
.dr .f{border-top:1px solid var(--line);padding:6px 12px;font-size:11px;display:flex;justify-content:space-between;color:var(--muted)}
.dr .f span:last-child{color:var(--todo);font-weight:600}
.chat{background:#f8f7fc;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:10px}
.msg .av{width:32px;height:32px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:16px;flex:none}
.msg .bd{font-size:12.5px;line-height:1.7;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;flex:1}
.msg .bd b.h{display:block;color:var(--c0)}
.msg .bd .btns{display:flex;gap:6px;margin-top:6px}
.msg .bd .btns span{font-size:11px;border:1px solid var(--line2);border-radius:6px;padding:1px 10px}
.doc{border:1px solid var(--line);border-radius:12px;padding:18px 22px;font-size:12.5px}
.doc h4{text-align:center;font-size:17px;letter-spacing:.2em;margin-bottom:10px}
.doc .meta{display:flex;justify-content:space-between;font-size:12px;margin-bottom:10px}
.doc .tot{display:flex;justify-content:flex-end;gap:14px;font-size:15px;font-weight:700;margin-top:8px}
.doc .num{text-align:right;font-variant-numeric:tabular-nums}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.sum div{background:var(--bg);border-radius:10px;padding:8px 12px;font-size:11.5px;color:var(--muted)}
.sum b{display:block;font-size:22px;color:var(--text)}
.foot{font-size:11.5px;color:var(--faint);margin-top:8px}

/* 裏側 */
.back{position:absolute;inset:0;background:rgba(30,27,75,.95);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:40px 56px;opacity:0;pointer-events:none;transition:.5s;z-index:10}
.back.in{opacity:1;pointer-events:auto}

function edgePath(a,b){
  const A=POS[a],B=POS[b];

  return `M${x1} ${y1} C${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}`;
}

function travel(ei, dur, color, done){
  const p=$("e"+ei), L=p.getTotalLength();
  const tok=document.createElementNS("http://www.w3.org/2000/svg","circle");
  tok.setAttribute("r","7"); tok.setAttribute("fill",color); tok.setAttribute("stroke","#fff"); tok.setAttribute("stroke-width","2.5");
  tok.style.filter=`drop-shadow(0 0 6px ${color})`;
  $("tokens").appendChild(tok);
  p.classList.add("hot"); p.style.setProperty("--ec",color);
  const t0=performance.now(), id=runId; let fin=false;
  const step=now=>{
    if(fin) return;
    const t=Math.min(1,(now-t0)/dur), e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2, pt=p.getPointAtLength(L*e);
    tok.setAttribute("cx",pt.x); tok.setAttribute("cy",pt.y);
    if(t<1) rafs.push(requestAnimationFrame(step));
  };
  rafs.push(requestAnimationFrame(step));
  // 終わりは時間で決める（画面の描画が止まっていても、処理は必ず最後まで進む）
  at(dur, ()=>{ if(id!==runId) return; fin=true; tok.remove(); at(120,()=>p.classList.remove("hot")); done&&done(); });
}

    else if(state==="done"){ state="back"; $("back").classList.add("in"); }
    else if(state==="back"){ state="done"; $("back").classList.remove("in"); }
  } else if(/^[1-9]$/.test(e.key) && +e.key<=FLOWS.length){ cur=+e.key-1; reset(); }
  else if(e.key==="r"||e.key==="R"){ reset(); }
});
window.addEventListener("resize",fit);
reset();
</script>
